name: Release DynaX Studio

# Cut a release by pushing a version tag that matches the in-source version:
#   git tag v1.20.13 && git push origin v1.20.13
# The tag MUST equal BUNDLED_ADDON_VERSION in launcher/blender_service.py — the
# job fails loudly if they drift, so a forgotten version bump can't ship.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version from tag and verify it matches the source
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRC=$(python -c "import re,pathlib; t=pathlib.Path('launcher/blender_service.py').read_text(); m=re.search(r'BUNDLED_ADDON_VERSION\s*=\s*\(([^)]*)\)', t); print('.'.join(x.strip() for x in m.group(1).split(',')))")
          echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "src=$SRC"  >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "$SRC" ]; then
            echo "::error::Tag v$TAG does not match BUNDLED_ADDON_VERSION ($SRC) in launcher/blender_service.py. Bump the source version and re-tag."
            exit 1
          fi
          echo "Building DynaX Studio $TAG"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller PySide6 packaging

      - name: Build launcher (PyInstaller)
        run: pyinstaller --noconfirm --distpath builds --workpath build_work packaging/dynax_studio.spec

      - name: Package the build
        shell: bash
        run: |
          cd builds
          7z a "../DynaX-Studio-${{ steps.version.outputs.tag }}-windows.zip" "DynaX_Studio" >/dev/null
          cd ..
          ls -lh DynaX-Studio-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DynaX Studio ${{ steps.version.outputs.tag }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: DynaX-Studio-${{ steps.version.outputs.tag }}-windows.zip
          body: |
            Automated build of DynaX Studio ${{ steps.version.outputs.tag }}.

            After this release publishes, point the backend update manifest at it so
            installed apps show the "update available" banner:

            - `DYNAX_CURRENT_RELEASE_VERSION = ${{ steps.version.outputs.tag }}`
            - `DYNAX_RELEASE_DOWNLOAD_URL = <this release's asset URL>`
            - `DYNAX_RELEASE_NOTES_URL = ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}`
