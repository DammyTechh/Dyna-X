name: CI

# Fast sanity checks on every push / PR: the launcher's own headless self-tests.
# --selftest exercises Blender discovery + command building with no Qt.
# --guicheck builds the REAL window offscreen (navigation, icons, pages) so a UI
# regression is caught before release.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  headless-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip PySide6 packaging
          # Offscreen Qt needs these system libraries on the Ubuntu runner.
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Core self-test (no Qt)
        run: python launcher/main.py --selftest selftest.json && cat selftest.json

      - name: Offscreen GUI check (builds the real window)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python launcher/main.py --guicheck guicheck.json
          python - <<'PY'
          import json, sys
          d = json.load(open("guicheck.json"))
          # Fail CI if the window can't build or navigation/icons regress.
          assert d.get("pyside_loaded") is True, "PySide6 failed to load"
          assert d.get("title") == "DynaX Studio", d.get("title")
          nav = d.get("navigation", {})
          for key in ("home_renders", "paraforge_renders", "parafly_renders",
                      "back_works", "forward_works"):
              assert nav.get(key) is True, f"navigation.{key} failed"
          assert d.get("all_icons_ok") is True, "one or more icons did not render"
          print("GUI check passed:", json.dumps({k: d[k] for k in ("title","pages","all_icons_ok")}))
          PY
