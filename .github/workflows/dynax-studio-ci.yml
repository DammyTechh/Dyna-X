# PLACE AT REPO ROOT: .github/workflows/dynax-studio-ci.yml
# Headless launcher checks for the dynax-studio subfolder on push/PR.
name: CI DynaX Studio

on:
  push:
    paths: ["dynax-studio/**"]
  pull_request:
    paths: ["dynax-studio/**"]

jobs:
  headless-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dynax-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip PySide6 packaging
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Core self-test
        run: python launcher/main.py --selftest selftest.json && cat selftest.json
      - name: Offscreen GUI check
        env:
          QT_QPA_PLATFORM: offscreen
        run: python launcher/main.py --guicheck guicheck.json && cat guicheck.json
