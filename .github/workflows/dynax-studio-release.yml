# PLACE THIS AT THE REPO ROOT: .github/workflows/dynax-studio-release.yml
# (GitHub Actions only runs workflows in the ROOT .github/workflows/ — not in subfolders.)
#
# Cut a Studio release by pushing a namespaced tag that matches the in-source version:
#   git tag studio-v1.20.12 && git push origin studio-v1.20.12
# The tag must equal BUNDLED_ADDON_VERSION in dynax-studio/launcher/blender_service.py.

name: Release DynaX Studio

on:
  push:
    tags:
      - "studio-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dynax-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version from tag and verify it matches the source
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#studio-v}"
          SRC=$(python -c "import re,pathlib; t=pathlib.Path('launcher/blender_service.py').read_text(); m=re.search(r'BUNDLED_ADDON_VERSION\s*=\s*\(([^)]*)\)', t); print('.'.join(x.strip() for x in m.group(1).split(',')))")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "$SRC" ]; then
            echo "::error::Tag studio-v$TAG does not match BUNDLED_ADDON_VERSION ($SRC) in dynax-studio/launcher/blender_service.py."
            exit 1
          fi

      - name: Verify required build inputs exist
        shell: bash
        run: |
          missing=0
          [ -d templates ]       || echo "::warning::dynax-studio/templates/ not found — building launcher only. Add it for the full Blender workspace."
          [ -f assets/dynax.ico ]|| { echo "::error::dynax-studio/assets/dynax.ico is missing."; missing=1; }
          [ -f packaging/dynax_studio.spec ] || { echo "::error::packaging/dynax_studio.spec is missing."; missing=1; }
          [ "$missing" = "0" ] || exit 1

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller PySide6 packaging

      - name: Build launcher (PyInstaller)
        run: pyinstaller --noconfirm --distpath builds --workpath build_work packaging/dynax_studio.spec

      - name: Package the build
        shell: bash
        run: |
          cd builds
          7z a "../DynaX-Studio-${{ steps.version.outputs.tag }}-windows.zip" "DynaX_Studio" >/dev/null
          ls -lh ../DynaX-Studio-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DynaX Studio ${{ steps.version.outputs.tag }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dynax-studio/DynaX-Studio-${{ steps.version.outputs.tag }}-windows.zip
          body: |
            Automated Windows build of DynaX Studio ${{ steps.version.outputs.tag }}.

            After publishing, point the backend update manifest at this release:
            - DYNAX_CURRENT_RELEASE_VERSION = ${{ steps.version.outputs.tag }}
            - DYNAX_RELEASE_DOWNLOAD_URL    = this release's .zip asset URL
